<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<title>谱领航 TabPilot · 图片谱跟随</title>
<style>
  :root{
    --ink:#1a1f2e; --sub:#5a6478; --line:#e3e7ef; --bg:#f6f8fb;
    --accent:#2f6fed; --ok:#1a9e6c; --warn:#d97706; --risk:#d64545;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0 12px 0 0;font-weight:700}
  header h1 em{font-style:normal;color:var(--accent);font-size:12px;margin-left:6px}
  select,button,input{font:inherit}
  select,input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:76px}
  button{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;
    cursor:pointer;font-size:13.5px;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{opacity:.88;color:#fff}
  button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .spacer{flex:1}
  .lbl{font-size:12.5px;color:var(--sub)}
  .slider{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
  .slider input{width:90px;accent-color:var(--accent)}
  main{flex:1;overflow:hidden;position:relative;display:flex}
  #stage{flex:1;overflow:auto;background:#fff;position:relative}
  #imgWrap{position:relative;margin:0 auto;transform-origin:top center}
  #tabImg{display:block;max-width:100%;user-select:none;-webkit-user-drag:none}
  /* 谱行区域覆盖层 */
  .band{position:absolute;border:1px dashed rgba(47,111,237,.45);background:rgba(47,111,237,.04);cursor:pointer}
  .band:hover{background:rgba(47,111,237,.10)}
  .band.cur{border:1.5px solid rgba(214,69,69,.0)}
  /* 当前小节高亮框 */
  #barBox{position:absolute;border:2px solid #e11d48;background:rgba(225,29,72,.12);
    border-radius:4px;display:none;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.6) inset}
  /* 行进度扫描线 */
  #scanline{position:absolute;left:0;height:2px;background:linear-gradient(90deg,#e11d48,#f59e0b);
    display:none;pointer-events:none;opacity:.85}
  /* 右侧校准面板 */
  aside{width:250px;background:#fff;border-left:1px solid var(--line);overflow-y:auto;padding:12px}
  aside h3{font-size:13px;margin:6px 0 8px;color:var(--sub);font-weight:600}
  .bandItem{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 6px;
    border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
  .bandItem:hover{border-color:var(--accent)}
  .bandItem.cur{border-color:#e11d48;background:rgba(225,29,72,.05)}
  .bandItem b{flex:1}
  .bandItem input{width:44px;padding:2px 6px;font-size:12px}
  .bandItem .del{border:none;color:var(--risk);padding:2px 6px;font-size:13px}
  .tip{font-size:11.5px;color:var(--sub);line-height:1.6;margin:8px 0}
  footer{background:#fff;border-top:1px solid var(--line);padding:8px 18px;
    display:flex;align-items:center;gap:18px;font-size:13px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;color:var(--sub)}
  .chip b{color:var(--ink);font-variant-numeric:tabular-nums}
  .led{width:10px;height:10px;border-radius:50%;background:#c4ccd8;transition:.2s}
  .led.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .hint{font-size:12px;color:var(--sub)}
  /* 放大镜浮窗（canvas 绘制，无字体问题） */
  #magnifier{position:fixed;right:270px;bottom:60px;width:400px;height:190px;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,60,.18);
    background:#fff;overflow:hidden;display:none;z-index:50}
  #magnifier.on{display:block}
  #magnifier .mag-title{position:absolute;top:6px;left:10px;font-size:11px;color:var(--sub);z-index:2;
    background:rgba(255,255,255,.8);padding:1px 6px;border-radius:6px}
  #magCanvas{width:100%;height:100%}
  #testlog{display:none;position:absolute;left:8px;top:8px;background:#fff;border:1px solid #ccc;
    padding:8px;font-size:11px;font-family:Consolas,monospace;max-height:95%;overflow:auto;z-index:99}
  button,select,input{touch-action:manipulation}
  #btnPanel{display:none}
  /* 移动端适配：侧栏变抽屉，默认收起 */
  @media (max-width: 860px){
    header{padding:6px 8px;gap:6px}
    header h1{font-size:14px;margin-right:4px}
    header h1 em{display:none}
    button{padding:5px 9px;font-size:12.5px;border-radius:7px}
    select,input{padding:4px 6px}
    .slider{font-size:11.5px}
    .slider input{width:64px}
    footer{padding:6px 8px;gap:8px;font-size:11.5px}
    .hint{display:none}
    #btnPanel{display:inline-block}
    main{position:relative}
    aside{position:absolute;right:0;top:0;bottom:0;width:230px;z-index:40;
      box-shadow:-6px 0 20px rgba(20,30,60,.12);transform:translateX(100%);transition:transform .2s}
    aside.open{transform:translateX(0)}
    #magnifier{right:8px;bottom:52px;width:min(70vw,320px);height:120px}
  }
</style>
</head>
<body>
<header>
  <h1>🎸 谱领航<em>图片谱模式 · TabPilot</em></h1>
  <button onclick="location.href='index.html'">🎼 谱面模式</button>
  <button id="btnLoad" class="primary">📂 加载谱图</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <button id="btnDemo">使用示例谱</button>
  <span class="spacer"></span>
  <span class="lbl">BPM <input id="bpm" type="number" value="72" min="30" max="240" style="width:64px"></span>
  <span class="lbl">拍/小节 <input id="bpb" type="number" value="4" min="1" max="12" style="width:56px"></span>
  <button id="btnDetect">🤖 自动识别谱行</button>
  <button id="btnManual">✌️ 手动框行</button>
  <button id="btnClear">🗑 清空</button>
  <button id="btnMetro">🔔 节拍器</button>
  <button id="btnPanel">☰ 行列表</button>
  <button id="btnPlay" class="primary">▶ 开始跟随</button>
  <button id="btnPause">⏸ 暂停</button>
  <button id="btnStop">⏹ 停止</button>
  <div class="slider">速度 <input id="rate" type="range" min="50" max="200" value="100"><b id="rateVal">1.0x</b></div>
  <button id="btnMag" class="active">🔍</button>
</header>
<main>
  <div id="stage">
    <div id="imgWrap">
      <img id="tabImg" alt="谱图">
      <div id="barBox"></div>
      <div id="scanline"></div>
    </div>
  </div>
  <aside>
    <h3>谱行（点击行 = 从该行开始）</h3>
    <div id="bandList"><div class="tip">加载图片后点「自动识别谱行」，或用「手动框行」在图上依次点击行的上、下边界。</div></div>
    <div class="tip" id="tipManual" style="display:none;color:var(--warn)">手动框行中：点击第 <b id="manualStep">1</b> 个边界（上/下）。</div>
  </aside>
  <div id="magnifier">
    <div class="mag-title">🔍 放大跟随</div>
    <canvas id="magCanvas" width="800" height="380"></canvas>
  </div>
  <div id="testlog"></div>
</main>
<footer>
  <div class="chip"><span class="led" id="led"></span><span id="modeText">待机</span></div>
  <div class="chip">当前行 <b id="bandNum">-</b></div>
  <div class="chip">当前小节 <b id="barNum">-</b></div>
  <div class="chip">行进时间 <b id="elapsed">0.0s</b></div>
  <div class="hint" id="hint">加载谱图 → 识别谱行 → 开始跟随</div>
</footer>
<script src="imageTab.js"></script>
<script>
$('btnPanel').onclick = () => {
  const a = document.querySelector('aside');
  a.classList.toggle('open');
  $('btnPanel').classList.toggle('active', a.classList.contains('open'));
};
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW register failed', e));
}
</script>
</body>
</html>
