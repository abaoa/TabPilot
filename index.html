<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<title>谱领航 TabPilot · 吉他谱跟随</title>
<style>
  :root{
    --ink:#1a1f2e; --sub:#5a6478; --line:#e3e7ef; --bg:#f6f8fb;
    --accent:#2f6fed; --ok:#1a9e6c; --warn:#d97706; --risk:#d64545;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0 12px 0 0;font-weight:700}
  header h1 em{font-style:normal;color:var(--accent);font-size:12px;margin-left:6px}
  select,button{font:inherit}
  select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  button{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;
    cursor:pointer;font-size:13.5px;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{opacity:.88;color:#fff}
  button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .spacer{flex:1}
  .slider{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
  .slider input{width:90px;accent-color:var(--accent)}
  main{flex:1;overflow:hidden;position:relative}
  #alphatab{position:absolute;inset:0;overflow:auto;background:#fff}
  #fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    color:var(--sub);font-size:14px;text-align:center;padding:24px}
  footer{background:#fff;border-top:1px solid var(--line);padding:8px 18px;
    display:flex;align-items:center;gap:18px;font-size:13px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;color:var(--sub)}
  .chip b{color:var(--ink);font-variant-numeric:tabular-nums}
  .led{width:10px;height:10px;border-radius:50%;background:#c4ccd8;transition:.2s}
  .led.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .led.warn{background:var(--warn)}
  .led.bad{background:var(--risk)}
  .meter{width:120px;height:8px;border-radius:6px;background:#edf0f5;overflow:hidden}
  .meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b429,#1a9e6c);transition:width .12s}
  .hint{font-size:12px;color:var(--sub)}
  /* 当前音符高亮（SVG text 无 fill 属性，CSS 可覆盖） */
  .at-hl text{fill:#e11d48 !important}
  /* 放大镜浮窗 */
  #magnifier{position:fixed;right:16px;bottom:60px;width:380px;height:180px;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,60,.18);
    background:#fff;overflow:hidden;display:none;z-index:50}
  #magnifier.on{display:block}
  #magnifier .mag-title{position:absolute;top:6px;left:10px;font-size:11px;color:var(--sub);z-index:2;
    background:rgba(255,255,255,.8);padding:1px 6px;border-radius:6px}
  #magContent{width:100%;height:100%;overflow:hidden;position:relative;background:#fff}
  #magContent svg{position:absolute;left:0;top:0}
  /* 移动端适配 */
  button,select,input{touch-action:manipulation}
  @media (max-width: 860px){
    header{padding:6px 8px;gap:6px}
    header h1{font-size:14px;margin-right:4px}
    header h1 em{display:none}
    button{padding:5px 9px;font-size:12.5px;border-radius:7px}
    select{padding:5px 7px;max-width:120px}
    .slider{font-size:11.5px}
    .slider input{width:64px}
    main{flex-direction:column}
    footer{padding:6px 8px;gap:8px;font-size:11.5px}
    .meter{width:70px}
    .hint{display:none}
    #magnifier{right:8px;bottom:52px;width:min(72vw,340px);height:130px}
  }
</style>
</head>
<body>
<header>
  <h1>🎸 谱领航<em>谱面模式 · TabPilot v0.1</em></h1>
  <select id="song"></select>
  <button id="btnLoad">📂 导入 .gp</button>
  <input type="file" id="fileInput" accept=".gp3,.gp4,.gp5,.gpx,.gp,.musicxml,.xml,.mid,.midi" style="display:none">
  <button id="btnWalker" class="primary">▶ BPM 滚动</button>
  <button id="btnMic">🎤 麦克风跟随</button>
  <button id="btnSim">🤖 模拟跟随</button>
  <button id="btnMag">🔍 放大镜</button>
  <button id="btnStop">⏹ 停止</button>
  <div class="spacer"></div>
  <div class="slider">速度 <input id="rate" type="range" min="50" max="200" value="100"><b id="rateVal">1.0x</b></div>
  <div class="slider">缩放 <input id="zoom" type="range" min="60" max="160" value="100"><b id="zoomVal">100%</b></div>
  <div class="slider">🎤灵敏度 <input id="gate" type="range" min="-90" max="-40" value="-72"><b id="gateVal">-72dB</b></div>
</header>
<main>
  <div id="alphatab"></div>
  <div id="fallback"></div>
  <div id="magnifier">
    <div class="mag-title">🔍 放大跟随</div>
    <div id="magContent"></div>
  </div>
  <div id="testlog" style="display:none;position:absolute;left:8px;top:8px;background:#fff;border:1px solid #ccc;padding:8px;font-size:11px;font-family:monospace;max-height:90%;overflow:auto;z-index:99"></div>
</main>
<footer>
  <div class="chip"><span class="led" id="led"></span><span id="modeText">待机</span></div>
  <div class="chip">当前小节 <b id="barNum">-</b></div>
  <div class="chip">跟随置信度 <div class="meter"><i id="conf"></i></div></div>
  <div class="chip">输入电平 <div class="meter"><i id="lvl" style="background:linear-gradient(90deg,#2f6fed,#1a9e6c)"></i></div></div>
  <div class="chip">实时速度 <b id="speedVal">-</b></div>
  <div class="hint" id="hint"></div>
</footer>
<script src="vendor/alphaTab.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW register failed', e));
}
</script>
</body>
</html>
