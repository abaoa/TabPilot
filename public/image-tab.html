<!DOCTYPE html>
<!--
  ==========================================================================
  image-tab.html — 图片谱模式（光栅谱图：JPG / PNG 截图）

  与谱面模式（index.html）的区别：图片没有小节坐标信息，因此需要先把
  谱图按"行"校准（自动投影识别或手动框选），再按 BPM × 每行小节数展开
  时间轴，行内小节均分推进。

  多页支持：同一首歌可导入多张图片（多页），全曲时间轴跨页拼接，
  跟随到当前页末尾时自动翻到下一页。

  页面结构：
    header.app-header  顶栏（品牌 / 模式切换 / 参数 / 设置）
    main.app-main      舞台（谱图 + 覆盖层）与侧栏（页导航 + 谱行列表）
    footer.app-footer  状态栏（模式、当前页、当前行、当前小节、行进时间）
  ==========================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 图片谱跟随</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/theme.js"></script>
<!-- 多页导航的局部样式（避免改动 components.css） -->
<style>
  .pageNav {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 2px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--sub);
  }
  .pageNav .slash { opacity: .55; }
  .pageNav b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .btn.sm { padding: 4px 9px; font-size: 12px; }
  /* 舞台底部胶片条：真实缩略图，多页一眼可见、点击切换（常驻底部） */
  .filmstrip {
    position: sticky;
    bottom: 0;
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.28) 55%, rgba(0,0,0,.46) 100%);
    z-index: 5;
  }
  .filmstrip .thumb {
    position: relative;
    flex: 0 0 auto;
    width: 92px;
    height: 62px;
    padding: 0;
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .filmstrip .thumb:hover { transform: translateY(-2px); }
  .filmstrip .thumb img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    opacity: .8;
  }
  .filmstrip .thumb.cur { border-color: #fff; }
  .filmstrip .thumb.cur img { opacity: 1; }
  .filmstrip .thumb span {
    position: absolute;
    left: 4px; bottom: 3px;
    font-size: 11px;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 6px;
    background: rgba(0,0,0,.62);
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  /* 「更多」下拉菜单：收纳低频操作，降低工具栏密度 */
  .menu { position: relative; }
  .menu-pop {
    display: none;
    position: absolute;
    right: 0; top: calc(100% + 6px);
    min-width: 152px;
    padding: 6px;
    border-radius: 10px;
    background: var(--panel, #fff);
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    border: 1px solid var(--line, #e5e7eb);
    z-index: 30;
    flex-direction: column;
    gap: 4px;
  }
  .menu-pop.open { display: flex; }
  .menu-pop .btn.block { width: 100%; justify-content: flex-start; text-align: left; }

  /* 未载入谱图时隐藏空 <img>（否则会显示破图占位），并给出居中引导 */
  #tabImg:not([src]) { display: none; }
  .stageEmpty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 24px;
    text-align: center;
    color: var(--sub, #667085);
    pointer-events: none;
  }
  .stageEmpty b { font-size: 15px; color: var(--ink, #1f2430); }
  .stageEmpty span { font-size: 12.5px; line-height: 1.7; max-width: 420px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>

    <nav class="tabs">
      <a href="index.html">🎼 谱面模式</a>
      <span class="on">🖼 图片谱模式</span>
    </nav>

    <div class="spacer"></div>

    <div class="group">
      <span class="glabel">参数</span>
      <span class="lbl">BPM <input id="bpm" type="number" value="72" min="30" max="240" aria-label="速度 BPM"></span>
      <span class="lbl">拍/小节 <input id="bpb" type="number" value="4" min="1" max="12" aria-label="每小节拍数"></span>
      <span class="slider">速度<input id="rate" type="range" min="50" max="200" step="5" value="100" aria-label="播放速度"><b id="rateVal">1.0x</b></span>
    </div>

    <span class="app-ver">v1.0.0</span>
    <button class="btn icon" id="btnSettings" title="设置" aria-label="设置">⚙️</button>
  </div>

  <div class="toolbar">
    <div class="group">
      <span class="glabel">文件</span>
      <button class="btn primary" id="btnLoad">📂 加载谱图</button>
      <button class="btn" id="btnAdd">➕ 追加页</button>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    </div>

    <div class="group">
      <span class="glabel">识别</span>
      <button class="btn" id="btnDetect">🤖 自动识别</button>
      <button class="btn" id="btnManual">✌️ 手动框行</button>
      <button class="btn" id="btnClear">🗑 清空</button>
    </div>

    <div class="group">
      <span class="glabel">跟随</span>
      <button class="btn primary" id="btnPlay">▶ 开始跟随</button>
      <button class="btn" id="btnPause">⏸</button>
      <button class="btn" id="btnStop">⏹</button>
    </div>

    <div class="menu">
      <button class="btn" id="btnMore" aria-haspopup="true" aria-expanded="false">⋯ 更多</button>
      <div class="menu-pop" id="morePop" role="menu">
        <button class="btn block" id="btnDemo">🖼 示例谱</button>
        <button class="btn block" id="btnMetro">🔔 节拍器</button>
        <button class="btn block" id="btnMag">🔍 放大镜</button>
        <button class="btn block" id="btnPanel">☰ 行列表</button>
      </div>
    </div>
  </div>
</header>

<main class="app-main">
  <div class="stage" id="stage">
    <div id="stageEmpty" class="stageEmpty">
      <b>还没有载入谱图</b>
      <span>点「📂 加载谱图」可一次性多选同一首歌的多张图片（每张 = 一页，按顺序拼成一条时间轴）；<br>也可以从「⋯ 更多 → 🖼 示例谱」先试玩一下。</span>
    </div>
    <div id="imgWrap">
      <img id="tabImg" alt="谱图">
      <div id="barBox"></div>
      <div id="scanline"></div>
    </div>
    <div class="filmstrip" id="filmstrip" aria-label="多页缩略图"></div>
  </div>

  <aside class="app-aside" id="bandPanel">
    <h3>📋 谱行（点击行 = 从该行开始）</h3>
    <div class="pageNav">
      <span class="glabel">页</span>
      <button class="btn sm" id="btnPrevPage" aria-label="上一页">◀</button>
      <b id="pageNum">0</b><span class="slash">/</span><b id="pageTotal">0</b>
      <button class="btn sm" id="btnNextPage" aria-label="下一页">▶</button>
    </div>
    <div id="bandList">
      <div class="tip">加载图片后点「🤖 自动识别谱行」，或用「✌️ 手动框行」在图上依次点击行的上、下边界。</div>
    </div>
    <div class="tip" id="tipManual" style="display:none">手动框行中：点击第 <b id="manualStep">1</b> 个边界（上/下）。</div>
  </aside>

  <!-- 放大跟随窗：canvas 光栅放大当前小节（图片没有矢量信息，直接缩放像素） -->
  <div class="magnifier" id="magnifier">
    <div class="mag-title">🔍 放大跟随</div>
    <button class="mag-x" id="magClose" title="关闭放大镜" aria-label="关闭放大镜">✕</button>
    <canvas id="magCanvas" width="800" height="380"></canvas>
  </div>
</main>

<footer class="app-footer">
  <div class="chip"><span class="led" id="led"></span><span id="modeText">待机</span></div>
  <div class="chip">当前行 <b id="bandNum">-</b></div>
  <div class="chip">当前小节 <b id="barNum">-</b></div>
  <div class="chip">行进时间 <b id="elapsed">0.0s</b></div>
  <div class="hint" id="hint">加载谱图 → 识别谱行 → 开始跟随</div>
</footer>

<script src="js/settings.js"></script>
<script src="js/image-tab.js"></script>
<script>
  'use strict';
  // 窄屏下侧栏变为抽屉，由「行列表」按钮开合
  document.getElementById('btnPanel').onclick = function () {
    var panel = document.getElementById('bandPanel');
    panel.classList.toggle('open');
    this.classList.toggle('active', panel.classList.contains('open'));
  };
  document.getElementById('magClose').onclick = function () {
    document.getElementById('btnMag').click();
  };
  // 与 index.html 一致：桌面壳（tauri:// 或 tauri.localhost）内不注册 Service Worker，
  // 并清理历史遗留注册与缓存（原因见 index.html 中的说明）。
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var isShell = location.protocol === 'tauri:' ||
                  /(^|\.)tauri\.localhost$/i.test(location.hostname);
    if (isShell) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) {
          ks.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
      return;
    }
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Service Worker 注册失败', e);
    });
  })();
</script>
</body>
</html>
