<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 图片谱跟随</title>
<style>
  :root{
    --ink:#141a26; --sub:#5b6678; --line:#e4e8ef; --bg:#eff2f7; --card:#fff;
    --accent:#2f6fed; --accent-d:#1e59d0; --accent-w:#eaf1ff;
    --ok:#12a06a; --warn:#d97706; --risk:#d64545;
    --r:10px; --sh:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

  /* ================= header ================= */
  header{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);
    padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px;z-index:20;
    box-shadow:0 1px 2px rgba(16,24,40,.03)}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-size:16px;font-weight:800;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
  .brand .tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-w);
    padding:2px 8px;border-radius:999px}
  .tabs{display:flex;gap:3px;background:#f2f5fa;padding:3px;border-radius:999px}
  .tabs a,.tabs span{font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:999px;
    color:var(--sub);text-decoration:none;transition:.15s;white-space:nowrap}
  .tabs a:hover{color:var(--accent);background:#e9eefa}
  .tabs .on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .spacer{flex:1;min-width:6px}

  .toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .group{display:inline-flex;align-items:center;gap:5px;padding:3px 7px 3px 9px;
    background:#f7f9fc;border:1px solid var(--line);border-radius:12px;flex-wrap:nowrap}
  .glabel{font-size:10px;font-weight:700;color:#9aa5b8;letter-spacing:.04em;margin-right:1px}

  /* ================= controls ================= */
  select,button,input{font:inherit}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;
    font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  button{padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;
    color:var(--ink);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px;transition:all .15s}
  button:hover{border-color:#c3d3f2;background:#f7faff;color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 2px 8px rgba(47,111,237,.28)}
  button.primary:hover{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
  button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  input[type=number]{width:50px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;
    background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);text-align:center}
  .lbl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);font-weight:600;
    white-space:nowrap}
  .slider{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);
    font-weight:600;white-space:nowrap}
  .slider b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:32px}
  input[type=range]{width:70px;accent-color:var(--accent);cursor:pointer}
  button,select,input{touch-action:manipulation}
  #btnPanel{display:none}

  /* ================= stage ================= */
  main{flex:1;overflow:hidden;position:relative;display:flex;gap:12px;padding:12px}
  #stage{flex:1;overflow:auto;background:var(--card);position:relative;
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
  #imgWrap{position:relative;margin:0 auto;transform-origin:top center}
  #tabImg{display:block;max-width:100%;user-select:none;-webkit-user-drag:none;border-radius:0}
  /* 谱行区域覆盖层 */
  .band{position:absolute;border:1px dashed rgba(47,111,237,.45);background:rgba(47,111,237,.04);
    cursor:pointer;border-radius:4px}
  .band:hover{background:rgba(47,111,237,.10)}
  .band.cur{border:1.5px solid rgba(214,69,69,0)}
  /* 当前小节高亮框 */
  #barBox{position:absolute;border:2px solid #e11d48;background:rgba(225,29,72,.12);
    border-radius:4px;display:none;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.6) inset}
  /* 行进度扫描线 */
  #scanline{position:absolute;left:0;height:2px;background:linear-gradient(90deg,#e11d48,#f59e0b);
    display:none;pointer-events:none;opacity:.85}

  /* 右侧校准面板 */
  aside{flex:0 0 auto;width:262px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--sh);overflow-y:auto;padding:14px}
  aside h3{font-size:12px;margin:0 0 10px;color:var(--sub);font-weight:700;letter-spacing:.02em;
    display:flex;align-items:center;gap:6px}
  .bandItem{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 8px;
    border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;transition:.15s;
    background:#fff}
  .bandItem:hover{border-color:#c3d3f2;background:#f7faff}
  .bandItem.cur{border-color:#e11d48;background:rgba(225,29,72,.05)}
  .bandItem b{flex:1;font-weight:600}
  .bandItem input[type=number]{width:46px;padding:3px 6px;font-size:12px}
  .bandItem .del{border:none;background:transparent;color:var(--risk);padding:2px 6px;font-size:13px;
    box-shadow:none}
  .bandItem .del:hover{color:#fff;background:var(--risk);border-color:var(--risk)}
  .tip{font-size:11.5px;color:var(--sub);line-height:1.7;margin:8px 0}
  #tipManual{color:var(--warn);font-weight:600}

  /* 放大镜浮窗（canvas 绘制，无字体问题） */
  #magnifier{position:fixed;right:286px;bottom:64px;width:400px;height:190px;
    border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(16,24,40,.18);
    background:#fff;overflow:hidden;display:none;z-index:50}
  #magnifier.on{display:block}
  #magnifier .mag-title{position:absolute;top:8px;left:12px;font-size:11px;font-weight:600;
    color:var(--sub);z-index:2;background:rgba(255,255,255,.85);padding:2px 9px;border-radius:999px;
    border:1px solid var(--line)}
  .mag-x{position:absolute;top:6px;right:8px;z-index:3;width:24px;height:24px;padding:0;
    border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--sub);
    font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
  .mag-x:hover{color:var(--risk);border-color:var(--risk);background:#fff}
  #magCanvas{width:100%;height:100%;display:block}

  /* ================= footer ================= */
  footer{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:9px 16px;
    display:flex;align-items:center;gap:16px;font-size:12.5px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:7px;color:var(--sub);font-weight:600}
  .chip b{color:var(--ink);font-variant-numeric:tabular-nums}
  .led{width:9px;height:9px;border-radius:50%;background:#c4ccd8;transition:.2s}
  .led.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .led.warn{background:var(--warn)}
  .hint{font-size:12px;color:#9aa5b8}
  #testlog{display:none;position:absolute;left:20px;top:20px;background:#fff;border:1px solid #ccc;
    padding:8px;font-size:11px;font-family:Consolas,monospace;max-height:90%;overflow:auto;z-index:99;
    border-radius:8px}

  /* ================= mobile ================= */
  @media (max-width:900px){
    header{padding:7px 9px 9px;gap:7px}
    .brand{font-size:14px}
    .brand .tag{display:none}
    .topbar .group{flex:1 0 100%}
    .toolbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
    .toolbar::-webkit-scrollbar{display:none}
    .group{flex:0 0 auto;padding:3px 6px 3px 8px;border-radius:11px}
    .glabel{display:none}
    button{padding:6px 10px;font-size:12.5px}
    #btnPanel{display:inline-flex}
    input[type=number]{width:46px;padding:4px 5px}
    input[type=range]{width:54px}
    .slider b{min-width:28px}
    main{gap:0;padding:8px}
    #stage{border-radius:12px}
    aside{position:absolute;right:8px;top:8px;bottom:8px;width:250px;z-index:40;
      box-shadow:-8px 0 26px rgba(16,24,40,.16);transform:translateX(calc(100% + 18px));
      transition:transform .22s}
    aside.open{transform:none}
    footer{padding:7px 10px;gap:10px;font-size:11.5px}
    .hint{display:none}
    #magnifier{right:8px;bottom:54px;width:min(72vw,320px);height:122px}
  }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>
    <div class="tabs">
      <a href="index.html">🎼 谱面模式</a>
      <span class="on">🖼 图片谱模式</span>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <span class="glabel">参数</span>
      <span class="lbl">BPM <input id="bpm" type="number" value="72" min="30" max="240"></span>
      <span class="lbl">拍/小节 <input id="bpb" type="number" value="4" min="1" max="12"></span>
      <span class="slider">速度<input id="rate" type="range" min="50" max="200" value="100"><b id="rateVal">1.0x</b></span>
    </div>
  </div>

  <div class="toolbar">
    <div class="group">
      <span class="glabel">文件</span>
      <button id="btnLoad" class="primary">📂 加载谱图</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <button id="btnDemo">使用示例谱</button>
    </div>

    <div class="group">
      <span class="glabel">识别</span>
      <button id="btnDetect">🤖 自动识别谱行</button>
      <button id="btnManual">✌️ 手动框行</button>
      <button id="btnClear">🗑 清空</button>
    </div>

    <div class="group">
      <span class="glabel">播放</span>
      <button id="btnPlay" class="primary">▶ 开始跟随</button>
      <button id="btnPause">⏸ 暂停</button>
      <button id="btnStop">⏹ 停止</button>
      <button id="btnMetro">🔔 节拍器</button>
    </div>

    <div class="group">
      <span class="glabel">视图</span>
      <button id="btnPanel">☰ 行列表</button>
      <button id="btnMag" class="active" title="放大镜开关">🔍</button>
    </div>
  </div>
</header>

<main>
  <div id="stage">
    <div id="imgWrap">
      <img id="tabImg" alt="谱图">
      <div id="barBox"></div>
      <div id="scanline"></div>
    </div>
  </div>

  <aside>
    <h3>📋 谱行（点击行 = 从该行开始）</h3>
    <div id="bandList"><div class="tip">加载图片后点「自动识别谱行」，或用「手动框行」在图上依次点击行的上、下边界。</div></div>
    <div class="tip" id="tipManual" style="display:none">手动框行中：点击第 <b id="manualStep">1</b> 个边界（上/下）。</div>
  </aside>

  <div id="magnifier">
    <div class="mag-title">🔍 放大跟随</div>
    <button class="mag-x" id="magClose" title="关闭放大镜">✕</button>
    <canvas id="magCanvas" width="800" height="380"></canvas>
  </div>

  <div id="testlog"></div>
</main>

<footer>
  <div class="chip"><span class="led" id="led"></span><span id="modeText">待机</span></div>
  <div class="chip">当前行 <b id="bandNum">-</b></div>
  <div class="chip">当前小节 <b id="barNum">-</b></div>
  <div class="chip">行进时间 <b id="elapsed">0.0s</b></div>
  <div class="hint" id="hint">加载谱图 → 识别谱行 → 开始跟随</div>
</footer>

<script src="js/imageTab.js"></script>
<script>
$('btnPanel').onclick = () => {
  const a = document.querySelector('aside');
  a.classList.toggle('open');
  $('btnPanel').classList.toggle('active', a.classList.contains('open'));
};
$('magClose').onclick = () => $('btnMag').click();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW register failed', e));
}
</script>
</body>
</html>
