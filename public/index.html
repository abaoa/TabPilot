<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 吉他谱跟随</title>
<style>
  :root{
    --ink:#141a26; --sub:#5b6678; --line:#e4e8ef; --bg:#eff2f7; --card:#fff;
    --accent:#2f6fed; --accent-d:#1e59d0; --accent-w:#eaf1ff;
    --ok:#12a06a; --warn:#d97706; --risk:#d64545;
    --r:10px; --sh:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

  /* ================= header ================= */
  header{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);
    padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px;z-index:20;
    box-shadow:0 1px 2px rgba(16,24,40,.03)}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-size:16px;font-weight:800;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
  .brand .tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-w);
    padding:2px 8px;border-radius:999px}
  .tabs{display:flex;gap:3px;background:#f2f5fa;padding:3px;border-radius:999px}
  .tabs a,.tabs span{font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:999px;
    color:var(--sub);text-decoration:none;transition:.15s;white-space:nowrap}
  .tabs a:hover{color:var(--accent);background:#e9eefa}
  .tabs .on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .spacer{flex:1;min-width:6px}
  .ver{font-size:11px;color:#9aa5b8;font-weight:600}

  .toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .group{display:inline-flex;align-items:center;gap:5px;padding:3px 7px 3px 9px;
    background:#f7f9fc;border:1px solid var(--line);border-radius:12px;flex-wrap:nowrap}
  .glabel{font-size:10px;font-weight:700;color:#9aa5b8;letter-spacing:.04em;margin-right:1px}

  /* ================= controls ================= */
  select,button,input{font:inherit}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;
    font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;max-width:180px}
  button{padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;
    color:var(--ink);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px;transition:all .15s}
  button:hover{border-color:#c3d3f2;background:#f7faff;color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 2px 8px rgba(47,111,237,.28)}
  button.primary:hover{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
  button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .slider{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);
    font-weight:600;white-space:nowrap}
  .slider b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:34px}
  input[type=range]{width:76px;accent-color:var(--accent);cursor:pointer}
  button,select,input{touch-action:manipulation}

  /* ================= stage ================= */
  main{flex:1;overflow:hidden;position:relative}
  #alphatab{position:absolute;inset:12px;overflow:auto;background:var(--card);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
  #fallback{position:absolute;inset:12px;display:none;align-items:center;justify-content:center;
    color:var(--sub);font-size:14px;text-align:center;padding:24px;background:var(--card);
    border:1px solid var(--line);border-radius:14px}
  /* 当前音符高亮（SVG text 无 fill 属性，CSS 可覆盖） */
  .at-hl text{fill:#e11d48 !important}

  /* 放大镜浮窗 */
  #magnifier{position:fixed;right:18px;bottom:64px;width:380px;height:180px;
    border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(16,24,40,.18);
    background:#fff;overflow:hidden;display:none;z-index:50}
  #magnifier.on{display:block}
  #magnifier .mag-title{position:absolute;top:8px;left:12px;font-size:11px;font-weight:600;
    color:var(--sub);z-index:2;background:rgba(255,255,255,.85);padding:2px 9px;border-radius:999px;
    border:1px solid var(--line)}
  .mag-x{position:absolute;top:6px;right:8px;z-index:3;width:24px;height:24px;padding:0;
    border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--sub);
    font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
  .mag-x:hover{color:var(--risk);border-color:var(--risk);background:#fff}
  #magContent{width:100%;height:100%;overflow:hidden;position:relative;background:#fff}
  #magContent svg{position:absolute;left:0;top:0}

  /* ================= footer ================= */
  footer{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:9px 16px;
    display:flex;align-items:center;gap:16px;font-size:12.5px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:7px;color:var(--sub);font-weight:600}
  .chip b{color:var(--ink);font-variant-numeric:tabular-nums}
  .led{width:9px;height:9px;border-radius:50%;background:#c4ccd8;transition:.2s}
  .led.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .led.warn{background:var(--warn)}
  .led.bad{background:var(--risk)}
  .meter{width:110px;height:7px;border-radius:6px;background:#edf0f5;overflow:hidden}
  .meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b429,#12a06a);
    transition:width .12s}
  .hint{font-size:12px;color:#9aa5b8}

  /* ================= mobile ================= */
  @media (max-width:900px){
    header{padding:7px 9px 9px;gap:7px}
    .brand{font-size:14px}
    .brand .tag,.ver{display:none}
    .topbar .group{flex:1 0 100%}
    .toolbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
    .toolbar::-webkit-scrollbar{display:none}
    .group{flex:0 0 auto;padding:3px 6px 3px 8px;border-radius:11px}
    .glabel{display:none}
    button{padding:6px 10px;font-size:12.5px}
    select{max-width:140px;font-size:12.5px}
    input[type=range]{width:56px}
    .slider b{min-width:28px}
    #alphatab,#fallback{inset:8px;border-radius:12px}
    footer{padding:7px 10px;gap:10px;font-size:11.5px}
    .meter{width:64px}
    .hint{display:none}
    #magnifier{right:8px;bottom:54px;width:min(74vw,330px);height:126px}
  }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>
    <div class="tabs">
      <span class="on">🎼 谱面模式</span>
      <a href="imageTab.html">🖼 图片谱模式</a>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <span class="glabel">参数</span>
      <span class="slider">速度<input id="rate" type="range" min="50" max="200" value="100"><b id="rateVal">1.0x</b></span>
      <span class="slider">缩放<input id="zoom" type="range" min="60" max="160" value="100"><b id="zoomVal">100%</b></span>
      <span class="slider">🎤灵敏度<input id="gate" type="range" min="-90" max="-40" value="-72"><b id="gateVal">-72dB</b></span>
    </div>
  </div>

  <div class="toolbar">
    <div class="group">
      <span class="glabel">曲目</span>
      <select id="song"></select>
      <button id="btnLoad">📂 导入 .gp</button>
      <input type="file" id="fileInput" accept=".gp3,.gp4,.gp5,.gpx,.gp,.musicxml,.xml,.mid,.midi" style="display:none">
    </div>

    <div class="group">
      <span class="glabel">跟随</span>
      <button id="btnWalker" class="primary">▶ BPM 滚动</button>
      <button id="btnMic">🎤 麦克风</button>
      <button id="btnSim">🤖 模拟</button>
      <button id="btnStop">⏹ 停止</button>
    </div>

    <div class="group">
      <span class="glabel">视图</span>
      <button id="btnMag">🔍 放大镜</button>
    </div>
  </div>
</header>

<main>
  <div id="alphatab"></div>
  <div id="fallback"></div>
  <div id="magnifier">
    <div class="mag-title">🔍 放大跟随</div>
    <button class="mag-x" id="magClose" title="关闭放大镜">✕</button>
    <div id="magContent"></div>
  </div>
  <div id="testlog" style="display:none;position:absolute;left:20px;top:20px;background:#fff;border:1px solid #ccc;padding:8px;font-size:11px;font-family:monospace;max-height:88%;overflow:auto;z-index:99;border-radius:8px"></div>
</main>

<footer>
  <div class="chip"><span class="led" id="led"></span><span id="modeText">待机</span></div>
  <div class="chip">当前小节 <b id="barNum">-</b></div>
  <div class="chip">跟随置信度 <div class="meter"><i id="conf"></i></div></div>
  <div class="chip">输入电平 <div class="meter"><i id="lvl" style="background:linear-gradient(90deg,#2f6fed,#12a06a)"></i></div></div>
  <div class="chip">实时速度 <b id="speedVal">-</b></div>
  <div class="hint" id="hint"></div>
</footer>

<script src="vendor/alphaTab.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('magClose').onclick = () => document.getElementById('btnMag').click();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW register failed', e));
}
</script>
</body>
</html>
