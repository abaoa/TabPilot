<!DOCTYPE html>
<!--
  ==========================================================================
  index.html — 谱面模式（结构化谱：alphaTex / .gp / MusicXML / MIDI）

  页面结构：
    header.app-header  顶栏（品牌 / 模式切换 / 参数 / 设置）
    main.app-main      舞台（#alphatab 谱面渲染区 + 放大镜浮层）
    footer.app-footer  状态栏（模式、小节、置信度、输入电平）

  依赖加载顺序（不可颠倒）：
    1. css/base.css + layout.css + components.css   设计令牌 → 布局 → 控件
    2. js/theme.js   同步执行，先于首屏渲染确定 data-theme，避免闪白
    3. vendor/alphaTab.js                           谱面渲染引擎（体积较大，放最后）
    4. js/settings.js → js/app.js                   设置模块先于业务脚本
  ==========================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 吉他谱跟随</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/theme.js"></script>
<!-- 演奏复盘面板的局部样式（避免改动共享的 components.css） -->
<style>
  .rv-chart {
    display: flex; align-items: stretch; gap: 2px;
    height: 108px; margin: 4px 0 6px; padding: 6px 4px;
    border-top: 1px solid var(--line, #e5e7eb);
    border-bottom: 1px solid var(--line, #e5e7eb);
    overflow-x: auto;
  }
  .rv-col { position: relative; flex: 0 0 auto; width: 10px; height: 100%; }
  .rv-col i { position: absolute; left: 0; right: 0; border-radius: 2px; min-height: 2px; }
  .rv-base {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: var(--line, #e5e7eb); opacity: .9;
  }
  .rv-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--sub, #667085); }
  .rv-legend s { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 3px; }

  /* 复盘弹窗骨架（与图片谱模式保持同一套观感，此处内联以免改动共享 CSS） */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15,18,24,.5); padding: 20px;
  }
  .modal-card {
    width: min(620px, 100%); max-height: 86vh; overflow: auto;
    background: var(--panel, #fff); color: var(--ink, #1f2430);
    border-radius: 14px; padding: 16px 18px 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.3);
  }
  .modal-head { display: flex; align-items: center; margin-bottom: 12px; }
  .modal-head b { flex: 1 1 auto; font-size: 15px; }
  .modal-head .x { border: none; background: transparent; font-size: 16px; cursor: pointer; color: inherit; }
  .pm-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .pm-stat {
    flex: 1 1 110px; padding: 9px 10px; border-radius: 10px;
    background: var(--line, #f1f3f7); text-align: center;
  }
  .pm-stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .pm-stat span { font-size: 11.5px; color: var(--sub, #667085); }
  .pm-sub { font-size: 12px; color: var(--sub, #667085); margin: 0 0 8px; line-height: 1.6; }
  .pm-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>

    <nav class="tabs">
      <span class="on">🎼 谱面模式</span>
      <a href="image-tab.html">🖼 图片谱模式</a>
    </nav>

    <div class="spacer"></div>

    <div class="group">
      <span class="glabel">参数</span>
      <span class="slider">速度<input id="rate" type="range" min="50" max="200" step="5" value="100" aria-label="跟随速度"><b id="rateVal">1.0x</b></span>
      <span class="slider only-wide">缩放<input id="zoom" type="range" min="60" max="160" step="5" value="100" aria-label="谱面缩放"><b id="zoomVal">100%</b></span>
      <span class="slider">灵敏度<input id="gate" type="range" min="-90" max="-40" step="1" value="-72" aria-label="麦克风噪声门"><b id="gateVal">-72dB</b></span>
    </div>

    <span class="app-ver">v1.0.0</span>
    <button class="btn icon" id="btnSettings" title="设置" aria-label="设置">⚙️</button>
  </div>

  <div class="toolbar">
    <div class="group">
      <span class="glabel">曲目</span>
      <select id="song" aria-label="选择演示曲目"></select>
      <button class="btn" id="btnLoad">📂 导入谱面</button>
      <input type="file" id="fileInput" accept=".gp3,.gp4,.gp5,.gpx,.gp,.musicxml,.xml,.mid,.midi" style="display:none">
    </div>

    <div class="group">
      <span class="glabel">跟随</span>
      <button class="btn primary" id="btnWalker">▶ BPM 滚动</button>
      <button class="btn" id="btnMic">🎤 麦克风</button>
      <button class="btn" id="btnSim">🤖 模拟</button>
      <button class="btn" id="btnStop">⏹ 停止</button>
    </div>

    <div class="group">
      <span class="glabel">视图</span>
      <button class="btn" id="btnMag">🔍 放大镜</button>
    </div>

    <div class="group">
      <span class="glabel">移调</span>
      <button class="btn" id="btnTrDown" title="降半音" aria-label="降半音">♭</button>
      <b id="trVal">原调</b>
      <button class="btn" id="btnTrUp" title="升半音" aria-label="升半音">♯</button>
      <button class="btn" id="btnTrReset" title="回到原调" aria-label="回到原调">⟲ 原调</button>
    </div>

    <div class="group">
      <span class="glabel">变调夹</span>
      <button class="btn" id="btnCapoDown" title="降一品" aria-label="降一品">−</button>
      <b id="capoVal">无</b>
      <button class="btn" id="btnCapoUp" title="升一品" aria-label="升一品">+</button>
      <button class="btn" id="btnCapoReset" title="取下变调夹" aria-label="取下变调夹">⟲ 无夹</button>
    </div>

    <div class="group">
      <span class="glabel">循环</span>
      <button class="btn" id="btnLoop" title="开启后播到 B 会自动回到 A 反复练">🔁 循环</button>
      <button class="btn sm" id="btnLoopA" title="把当前播放头设为循环起点 A">ⓐ</button>
      <button class="btn sm" id="btnLoopB" title="把当前播放头设为循环终点 B">ⓑ</button>
      <input id="loopStopAfter" type="number" value="0" min="0" max="99" step="1" title="循环次数上限，0=不限" style="width:46px"> 次
      <span class="chip" id="loopChip" style="display:none">A/B <b id="loopRange">-</b></span>
    </div>

    <div class="group">
      <span class="glabel">和弦跟随</span>
      <span class="chip">谱面 <b id="chordExpect">—</b></span>
      <span class="chip">你弹 <b id="chordLive">—</b></span>
      <span class="led" id="chordLed" title="和弦匹配状态：绿=对上 红=弹错 灰=静音"></span>
    </div>

    <div class="group">
      <span class="glabel">复盘</span>
      <button class="btn" id="btnRec" title="录下这一遍演奏，存到本地后可回放">● 录音</button>
      <button class="btn" id="btnReview" title="把刚录的一遍和谱面拍点对齐，逐拍看节奏偏差">📈 复盘</button>
      <span class="chip" id="recChip" style="display:none">录音 <b id="recTime">0.0s</b></span>
    </div>
  </div>
</header>

<main class="app-main">
  <div id="alphatab"></div>
  <div id="fallback"></div>

  <!-- 放大跟随窗：克隆当前行 SVG 并放大，锚定到当前音符 -->
  <div class="magnifier" id="magnifier">
    <div class="mag-title">🔍 放大跟随</div>
    <button class="mag-x" id="magClose" title="关闭放大镜" aria-label="关闭放大镜">✕</button>
    <div id="magContent"></div>
  </div>
</main>

<!-- 演奏复盘：把录音与谱面拍点对齐，逐拍显示抢/拖偏差 + 回放 -->
<div class="modal" id="reviewModal" style="display:none" role="dialog" aria-modal="true" aria-label="演奏复盘">
  <div class="modal-card">
    <div class="modal-head">
      <b>🎙 演奏复盘</b>
      <button class="x" id="rvClose" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="pm-stats" id="rvStats"></div>
    <p class="pm-sub">每拍偏差：向上=拖拍（弹晚了），向下=抢拍（弹早了），灰=漏弹</p>
    <div class="rv-chart" id="rvChart"></div>
    <div class="rv-legend">
      <span><s style="background:#10b981"></s>准（±50ms）</span>
      <span><s style="background:#f59e0b"></s>拖拍</span>
      <span><s style="background:#378add"></s>抢拍</span>
      <span><s style="background:#9aa5b8"></s>漏弹</span>
    </div>
    <p class="pm-sub" id="rvWorst"></p>
    <audio id="rvAudio" controls style="width:100%"></audio>
    <div class="pm-actions">
      <button class="btn sm" id="rvJump" title="把播放头跳到偏差最大的那一拍">↩ 跳到最差拍</button>
      <button class="btn sm" id="rvClose2">关闭</button>
    </div>
  </div>
</div>

<footer class="app-footer">
  <div class="chip"><span class="led" id="led"></span><span id="modeText">待机</span></div>
  <div class="chip">当前小节 <b id="barNum">-</b></div>
  <div class="chip">跟随置信度 <div class="meter"><i id="conf"></i></div></div>
  <div class="chip">输入电平 <div class="meter brand"><i id="lvl"></i></div></div>
  <div class="chip">实时速度 <b id="speedVal">-</b></div>
  <div class="chip" id="trChip" title="移调会同时改变显示、播放音高与 OTW 跟随的比对基准">移调 <b id="keyVal">原调</b></div>
  <div class="hint" id="hint"></div>
</footer>

<script src="vendor/alphaTab.js"></script>
<script src="js/settings.js"></script>
<script src="js/chord-core.js"></script>
<script src="js/timing-core.js"></script>
<script src="js/app.js"></script>
<script>
  'use strict';
  // 放大镜关闭按钮：复用视图按钮的开关逻辑，保持单一状态源
  document.getElementById('magClose').onclick = function () {
    document.getElementById('btnMag').click();
  };
  // PWA：仅在真正的 http(s) 站点注册 Service Worker。
  // ⚠️ 桌面壳（Tauri）内一律不注册，并清理历史遗留：
  //    壳用的是内部资产域 http://tauri.localhost，Service Worker 发出的网络请求
  //    不会经过 Tauri 资产协议的拦截；而 Chromium 会把 *.localhost 解析到回环地址，
  //    于是请求落到 127.0.0.1:80 —— 那里常驻着本机加速/代理类工具（如 FastGithub），
  //    会返回 JSON 错误页并污染缓存，表现为界面直接显示一段错误 JSON。
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var isShell = location.protocol === 'tauri:' ||
                  /(^|\.)tauri\.localhost$/i.test(location.hostname);
    if (isShell) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) {
          ks.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
      return;
    }
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Service Worker 注册失败', e);
    });
  })();
</script>
</body>
</html>
