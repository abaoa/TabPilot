[package]
name = "tab-pilot"
version = "1.0.0"
description = "谱领航 TabPilot · 吉他谱自动跟随练习工具"
authors = ["abaoa"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tab_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
